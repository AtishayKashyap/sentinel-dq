# Live demo on GitHub Pages: runs the 14-day clinic simulation in CI, exports the
# dashboard's API responses as static JSON, and serves the same React dashboard with
# no backend. Re-runs weekly so the data stays recent.
# One-time setup: Settings -> Pages -> Source: "GitHub Actions".
name: Live demo (GitHub Pages)

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLINIC_DB_URL: sqlite:///${{ github.workspace }}/clinic.db
      SENTINEL_RESULTS_URL: sqlite:///${{ github.workspace }}/results.db
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: pip install .
      - name: Simulate 14 days of checks on the demo clinic database
        run: sentinel demo --days 14
      - name: Export dashboard data as static JSON
        run: sentinel export-static --out web/public/data
      - name: Build dashboard in static mode
        working-directory: web
        env: { VITE_STATIC: "1", VITE_BASE: "/sentinel-dq/" }
        run: |
          npm ci
          npx vite build
          cp dist/index.html dist/404.html   # SPA deep links on Pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/dist }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
