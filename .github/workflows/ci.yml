name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: sentinel_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 20
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: mysql, MYSQL_DATABASE: sentinel_test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -pmysql" --health-interval 3s --health-retries 30
    env:
      SENTINEL_TEST_PG_URL: postgresql+psycopg://postgres:postgres@localhost:5432/sentinel_test
      SENTINEL_TEST_MYSQL_URL: mysql+pymysql://root:mysql@127.0.0.1:3306/sentinel_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests && ruff format --check src tests
      - name: Type check (mypy --strict)
        run: mypy
      - name: Validate suites
        run: sentinel validate
      - name: Test on SQLite, PostgreSQL 16 and MySQL 8 (coverage gate 80%)
        run: pytest --cov-report=xml
      - name: Dependency audit
        run: pip install pip-audit && pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: web }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high --omit=dev

  docker:
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build API image
        run: docker build -t sentinel-dq:ci .
      - name: Smoke test container
        run: |
          docker run -d --name api -p 8000:8000 sentinel-dq:ci
          for i in $(seq 1 20); do curl -sf localhost:8000/healthz && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: sentinel-dq:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
