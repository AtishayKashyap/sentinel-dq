[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-dq"
version = "0.1.0"
description = "Declarative SQL data-quality and drift monitoring engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typer>=0.12",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "pymysql>=1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "ruff>=0.5", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
sentinel = "sentinel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=sentinel --cov-report=term-missing --cov-fail-under=80"
markers = ["postgres: requires SENTINEL_TEST_PG_URL", "mysql: requires SENTINEL_TEST_MYSQL_URL"]

[tool.coverage.run]
omit = ["src/sentinel/scheduler.py", "src/sentinel/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "B008", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
"seed/*" = ["S"]
"scripts/*" = ["S"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["sentinel"]
ignore_missing_imports = true
